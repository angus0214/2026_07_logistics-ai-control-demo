# 資料字典（Raw 版）：Raw + Dictionary 對照組用。描述原始運費帳與髒資料規則，沒有整理過的 view。
# 用詞與 CONTEXT.md 一致；欄位必須和實際 schema 完全相同（tests/test_data_dictionary.py 會檢查）。

tables:
  bills_of_lading:
    purpose: 提單主表，一張貨件 (shipment) 一列。來自 OCR 萃取並經人工覆核。
    columns:
      id: 流水號，無業務意義。
      bl_number: B/L Number（提單號），貨件的唯一識別，例如 EGLV12345678（大寫、無空白）。
      shipper: 託運人，也就是客戶 (Customer)。
      consignee: 收貨人。不是客戶。
      destination: 目的地港口，格式如 'USLAX (Los Angeles)'，查詢時用 LIKE 模糊比對。
      gross_weight: 貨物總重，單位公斤。
      volume: 體積，單位 CBM。
      freight_cost: Quoted Freight（報價運費），提單上印的金額，USD。不是「運費」，見 business_rules。
      on_board_date: On-board Date（開航日），YYYY-MM-DD 字串。
      confidence_score: AI 萃取信心度 (0-100)。
      is_verified: 是否已由人工覆核確認 (1/0)。
      created_at: 資料建立時間 (UTC)，不是業務日期，不要拿來算期間。

  freight_ledger:
    purpose: 運費帳 (Freight Ledger)，財務系統匯出檔原樣載入，一列是一筆 Charge Line（費用明細）。所有欄位都是 TEXT，寫法不一致，必須先清理才能計算。
    columns:
      BL_NO: 提單號，但寫法不一：可能有小寫、空白或 -（如 'eglv-12345678'、' EGLV 12345678 '）。去空白、去 -、轉大寫後才能 JOIN bills_of_lading.bl_number；正規化後仍對不上的是系統外貨件。
      CUSTOMER: 客戶名，寫法不一（如 'APPLE INC'、'蘋果'）。用 customer_aliases 對應成標準 Shipper 名稱；別名表查不到的保留原名。
      CHG_CODE: 費用類型。OF＝海運費；THC＝碼頭處理費；BAF＝燃油附加費；CN＝Credit Note（沖銷）。這欄是乾淨的。
      AMOUNT: 金額字串，幣別混在字串裡，如 'USD 1,200.00'、'US$1,200.00'、'1200.00 usd'、'NT$36,000'、'TWD 36000'、'€980.00'、'EUR 980.00'、'¥150,000'、'JPY 150000'。要去掉幣別符號與千分位才能轉成數字。Credit Note 多數寫成正數，少數寫成 '-500' 或 '(500.00)'；一律以 CHG_CODE＝'CN' 判斷並視為負數。
      INV_DATE: Invoice Date（發票日），4 種格式混用：'2026/3/11'（月日不補零）、'11-Mar-26'、'20260311'、'2026.03.11'。要先轉成 YYYY-MM-DD；它決定換匯用哪個月份的匯率。

  customer_aliases:
    purpose: 客戶別名表，把運費帳裡的各種客戶名寫法對應到標準 Shipper 名稱（含標準名稱對應自己）。
    columns:
      alias: 運費帳 CUSTOMER 欄可能出現的寫法（去掉前後空白後比對）。
      shipper: 標準 Shipper 名稱，和 bills_of_lading.shipper 相同寫法。

  fx_rates:
    purpose: 月匯率表，涵蓋所有發票月份。
    columns:
      month: 發票月份，YYYY-MM。
      currency: 幣別 ISO 代碼（USD / TWD / EUR / JPY）。
      units_per_usd: 每 1 USD 可換多少該幣別。USD 金額＝原幣金額 ÷ units_per_usd。

business_rules:
  freight_means_billed_amount: >-
    沒特別指定的「運費」「請款」「營收」＝ Billed Amount（請款金額），從 freight_ledger 計算：
    一張提單的 Billed Amount ＝ 該提單所有 Charge Line 換成 USD 後的總和
    （先解析 AMOUNT 的幣別與數字，Credit Note 取負，再除以發票月份的 fx_rates.units_per_usd）。
    bills_of_lading.freight_cost 是 Quoted Freight（報價運費），只有問「報價」時才用；
    問「請款和報價差多少」才同時用兩者。
  period_by_on_board_date: >-
    「8 月的運費」這類期間問題，預設以 bills_of_lading.on_board_date（開航日）所在月份為準，
    要先把 BL_NO 正規化後 JOIN bills_of_lading 取得。只有明確問「發票日」「開票」「入帳」時才用 INV_DATE。
    正規化後仍對不上提單的列沒有開航日，不屬於任何開航日期間。
  unmatched_in_totals: >-
    沒指定期間、也沒用到提單屬性（目的地、收貨人等）的總額，例如「Apple 的總運費」「總請款」，
    要包含對不上提單的列：那是系統外貨件，但確實對客戶請了款。
    依開航日期間或提單屬性篩選時，這些列自然不會被算到。
  credit_note_negative: >-
    Credit Note（CHG_CODE＝'CN'）會減少客戶應付金額，一律算負數；
    不論 AMOUNT 寫成正數、'-500' 或 '(500.00)'，都以 CHG_CODE 判斷。
  customer_is_shipper: >-
    客戶 (Customer) 一律是 Shipper（本 demo 假設全部預付），不是 consignee。
    CUSTOMER 要用 customer_aliases 對應成和 bills_of_lading.shipper 相同的標準名稱；
    別名表查不到的保留原名，問特定客戶時也要考慮它（例如用 LIKE 比對）。

routing:
  shipments: 問提單、貨件數、貨量、重量、目的地、收貨人、報價運費 → bills_of_lading。
  money: >-
    問運費、請款、費用、沖銷、幣別 → freight_ledger（搭配 customer_aliases 與 fx_rates 清理）；
    需要提單屬性時，用正規化後的 BL_NO JOIN bills_of_lading。
